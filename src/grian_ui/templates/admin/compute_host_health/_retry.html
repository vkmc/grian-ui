{# Shared data is still being computed by another request: reload this partial (only) shortly. #}
{% if loading %}<span id="chh-retry-{{ uid }}" class="chh-retry" hidden></span>
<script>setTimeout(function () {
  // hidden tab: the page refreshes every section when it becomes visible
  if (document.visibilityState !== 'visible') { return; }
  // the partial's own loader: the closest ancestor that has hx-get, or the
  // closest ancestor that contains one (e.g. the displayed host's poller)
  var node = document.getElementById('chh-retry-{{ uid }}');
  var target = node && node.closest('[hx-get]');
  while (node && !target) {
    node = node.parentElement;
    target = node && node.querySelector('[hx-get]');
  }
  if (target) { htmx.trigger(target, 'chh-retry'); }
}, 3000);</script>{% endif %}
